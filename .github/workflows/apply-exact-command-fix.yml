name: Apply exact voice-command fix

on:
  push:
    branches:
      - fix/exact-voice-commands

permissions:
  contents: write

jobs:
  patch-command-matching:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/exact-voice-commands
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Replace prefix matching
        run: python .github/scripts/patch_exact_commands.py
      - name: Commit the actual fix
        run: |
          rm -f .github/scripts/patch_exact_commands.py
          rm -f .github/workflows/apply-exact-command-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Require exact phrases for system commands"
          git push origin HEAD:fix/exact-voice-commands
